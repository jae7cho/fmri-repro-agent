[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "extractor-mvp"
version = "0.0.1"
description = "MVP Methods Extractor: text-in -> span-grounded ProvenancedField values. Single-pipeline, single-pass; proves the end-to-end grounding loop for the SfN abstract."
authors = [{ name = "Jae Wook Cho", email = "jae7cho@gmail.com" }]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.0",
    "instructor>=1.0",
    # boto3 is litellm's Bedrock transport: build_client() constructs a Bedrock
    # client at runtime, so it is a runtime dep (floor, to track AWS model/region
    # additions), not dev. litellm imports it lazily on the first Bedrock call.
    "boto3>=1.34",
    "pydantic>=2.13.4,<3",
    # PDF text extraction. Runtime, not dev: load_pdf_text is on the only PDF-in path
    # (batch.py, and the A4 entry point), and pdf_loader imports pypdf inside a try that
    # returns ("", "failed"). Absent, every PDF fails with "pypdf returned no text" — a
    # message that blames the PDF — and pdf_creation_date returns None, silently disabling
    # KB version inference. command_survey and doi_date_resolver import it unguarded at
    # module level and would fail at import instead.
    "pypdf>=6.13.0",
    # extraction outputs are typed against the agent spec.
    "fmri-repro-agent",
]

[project.scripts]
# A4: one PDF in, one COBIDAS completeness report out. See src/extractor_mvp/report.py.
aespa-report = "extractor_mvp.report:main"

[tool.uv.sources]
fmri-repro-agent = { path = "..", editable = true }

[project.optional-dependencies]
# pandas is a real dependency of this package, not of the repository root. It is imported at
# module level by generate_sfn_review.py, which tests/test_sfn_review_clobber_guard.py imports,
# so an undeclared pandas is a COLLECTION failure, not a runtime one. It was declared only in
# the root pyproject's [dependency-groups] dev — and a dependency-group is not installed through
# a path/editable dependency, so `uv sync --all-extras` here never saw it. This is the SECOND of two
# collection failures that kept the extractor-mvp job red; it entered with 55e3a2f on 2026-09-14, two
# days after 815ec2f started the red run. Dev, not runtime: nothing under src/ imports it.
#
# openpyxl is NOT declared here, and the reason is scope: it is not part of a CI fix. The job does not
# need it — generate_sfn_review imports it lazily (:473, :501) and the clobber guard reads SpreadsheetML
# with the standard library on purpose — so declaring it would be an unrelated change riding along in a
# commit whose diff is meant to be attributable. It is a real gap and belongs in its own change.
#
# It is NOT withheld as a safeguard. "The generator cannot overwrite the adjudication cells because it
# crashes on a missing import" is the reasoning this repo already rejected, in tests/
# test_sfn_review_clobber_guard.py:6 ("A packaging bug is not a safeguard") and in the decision to copy
# the workbook out of the repo. What protects those cells is the backup outside the repository, the
# tracked review+correction projection, and the mutation-tested refuse_to_clobber_hand_review guard.
# Three deliberate protections; a packaging accident is not a fourth, and must not be recorded as one.
dev = ["ruff", "mypy", "pytest", "pytest-cov", "types-PyYAML", "pandas>=3.0.3"]

[tool.hatch.build.targets.wheel]
packages = ["src/extractor_mvp"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Intentional ambiguous-Unicode: the normalization maps and the span-resolver
# test fixtures must contain ligatures / math signs / smart quotes verbatim.
"src/extractor_mvp/span_resolver.py" = ["RUF001", "RUF003"]
"tests/test_span_resolver.py" = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_ignores = true
files = ["src", "tests"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["litellm", "litellm.*", "instructor", "instructor.*", "pypdf", "pypdf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
markers = [
    "live: requires live Bedrock API access (network + AWS creds); skipped by default. Run with `pytest -m live`.",
]
