[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "extractor-mvp"
version = "0.0.1"
description = "MVP Methods Extractor: text-in -> span-grounded ProvenancedField values. Single-pipeline, single-pass; proves the end-to-end grounding loop for the SfN abstract."
authors = [{ name = "Jae Wook Cho", email = "jae7cho@gmail.com" }]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.0",
    "instructor>=1.0",
    # boto3 is litellm's Bedrock transport: build_client() constructs a Bedrock
    # client at runtime, so it is a runtime dep (floor, to track AWS model/region
    # additions), not dev. litellm imports it lazily on the first Bedrock call.
    "boto3>=1.34",
    "pydantic>=2.13.4,<3",
    # PDF text extraction. Runtime, not dev: load_pdf_text is on the only PDF-in path
    # (batch.py, and the A4 entry point), and pdf_loader imports pypdf inside a try that
    # returns ("", "failed"). Absent, every PDF fails with "pypdf returned no text" — a
    # message that blames the PDF — and pdf_creation_date returns None, silently disabling
    # KB version inference. command_survey and doi_date_resolver import it unguarded at
    # module level and would fail at import instead.
    "pypdf>=6.13.0",
    # extraction outputs are typed against the agent spec.
    "fmri-repro-agent",
]

[project.scripts]
# A4: one PDF in, one COBIDAS completeness report out. See src/extractor_mvp/report.py.
aespa-report = "extractor_mvp.report:main"

[tool.uv.sources]
fmri-repro-agent = { path = "..", editable = true }

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest", "pytest-cov", "types-PyYAML"]

[tool.hatch.build.targets.wheel]
packages = ["src/extractor_mvp"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Intentional ambiguous-Unicode: the normalization maps and the span-resolver
# test fixtures must contain ligatures / math signs / smart quotes verbatim.
"src/extractor_mvp/span_resolver.py" = ["RUF001", "RUF003"]
"tests/test_span_resolver.py" = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_ignores = true
files = ["src", "tests"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["litellm", "litellm.*", "instructor", "instructor.*", "pypdf", "pypdf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
markers = [
    "live: requires live Bedrock API access (network + AWS creds); skipped by default. Run with `pytest -m live`.",
]
